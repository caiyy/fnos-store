name: Build store packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - cmd/**
      - internal/**
      - frontend/src/**
      - frontend/package.json
      - frontend/package-lock.json
      - fnos/**
      - apps.json
      - recommended.json
      - build.sh
      - web_embed.go
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download fnpack
        shell: bash
        run: |
          mkdir -p build
          curl -fsSL --retry 5 \
            -o build/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-amd64
          chmod +x build/fnpack

      - name: Test Go
        run: go test ./...

      - name: Build FPK packages
        shell: bash
        run: ./build.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cocode-store-fpk
          path: |
            dist/*.fpk
            dist/*.sha256
          if-no-files-found: error

      - name: Create fpk release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Cocode Store ${{ github.ref_name }}" \
            --generate-notes \
            dist/*.fpk \
            dist/*.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
